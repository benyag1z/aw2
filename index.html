<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Azim ve Umut</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      width: 80%;
      max-width: 800px;
      font-size: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #highlight {
      font-size: 28px;
      font-weight: bold;
      color: white;
    }

    .light {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: linear-gradient(to top, white, transparent);
      animation: riseLight 6s ease-out forwards;
    }

    @keyframes riseLight {
      0% { height: 0; opacity: 0; }
      50% { height: 40%; opacity: 0.5; }
      100% { height: 100%; opacity: 1; }
    }

    .whiteout {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      opacity: 0;
      animation: flashWhite 3s ease-in forwards;
      animation-delay: 7s;
    }

    @keyframes flashWhite {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const text = `Yorgunluk, bahane değildir.

Her sabah doğan güneş, yeniden başlamak için bir çağrıdır.

Bir kez daha dene. Düşsen de kalk. Yorulsan da devam et.

Çünkü vazgeçenler asla kazanamaz. Kazananlar ise asla vazgeçmez.

Zihin, disiplinle şekillenir. Güç, tekrarlarla doğar.

Çalışmak bir zorunluluk değil, bir karakter meselesidir.

Ve sen, bu karaktere sahipsin.

Unutma...\n\n`;
    const finalText = "Karanlıkta her zaman bir ışık vardır.\nOnu görmemiz yeterlidir.";

    let i = 0;
    const container = document.getElementById("container");

    function typeWriter() {
      if (i < text.length) {
        container.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      } else {
        // Yazı bittiğinde büyük metni göster
        setTimeout(showFinalText, 500);
      }
    }

    function showFinalText() {
      const highlight = document.createElement("div");
      highlight.id = "highlight";
      highlight.textContent = finalText;
      container.appendChild(highlight);

      // Işık animasyonu başlasın
      const lightDiv = document.createElement("div");
      lightDiv.classList.add("light");
      document.body.appendChild(lightDiv);

      // Tüm ekranı beyaza boyayan efekt
      const whiteout = document.createElement("div");
      whiteout.classList.add("whiteout");
      document.body.appendChild(whiteout);
    }

    typeWriter();
  </script>
</body>
</html>
