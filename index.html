<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Azim ve Umut</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      width: 80%;
      max-width: 800px;
      font-size: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      border-right: 2px solid white;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      from, to { border-color: transparent }
      50% { border-color: white }
    }

    .light {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: linear-gradient(to top, white, transparent);
      animation: riseLight 3s ease-out forwards;
    }

    @keyframes riseLight {
      0% { height: 0; opacity: 0; }
      30% { opacity: 0.7; }
      100% { height: 100%; opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const text = `Yorgunluk, bahane değildir.

Her sabah doğan güneş, yeniden başlamak için bir çağrıdır.

Bir kez daha dene. Düşsen de kalk. Yorulsan da devam et.

Çünkü vazgeçenler asla kazanamaz. Kazananlar ise asla vazgeçmez.

Zihin, disiplinle şekillenir. Güç, tekrarlarla doğar.

Çalışmak bir zorunluluk değil, bir karakter meselesidir.

Ve sen, bu karaktere sahipsin.

Unutma...

Karanlıkta her zaman bir ışık vardır.

Onu görmemiz yeterlidir.`;

    let i = 0;
    const container = document.getElementById("container");

    function typeWriter() {
      if (i < text.length) {
        container.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      }

      // Işık animasyonu tetikleme – son cümleye yaklaşınca
      if (i === Math.floor(text.length * 0.93)) {
        showLight();
      }
    }

    function showLight() {
      const lightDiv = document.createElement("div");
      lightDiv.classList.add("light");
      document.body.appendChild(lightDiv);
    }

    typeWriter();
  </script>
</body>
</html>
