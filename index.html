<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Azim ve Umut</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      width: 80%;
      max-width: 800px;
      font-size: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #final {
      font-size: 30px;
      font-weight: bold;
      margin-top: 40px;
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    .light {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: linear-gradient(to top, white, transparent);
      animation: riseLight 5s ease-in-out forwards;
    }

    @keyframes riseLight {
      0% { height: 0; opacity: 0; }
      100% { height: 100%; opacity: 1; }
    }

    .whiteout {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      opacity: 0;
      animation: flashWhite 3s ease-in forwards;
      animation-delay: 6s;
    }

    @keyframes flashWhite {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const yazilar = `Yorgunluk, bahane değildir.

Her sabah doğan güneş, yeniden başlamak için bir çağrıdır.

Bir kez daha dene. Düşsen de kalk. Yorulsan da devam et.

Çünkü vazgeçenler asla kazanamaz. Kazananlar ise asla vazgeçmez.

Zihin, disiplinle şekillenir. Güç, tekrarlarla doğar.

Çalışmak bir zorunluluk değil, bir karakter meselesidir.

Unutma...\n\n`;

    const finalText = `Ne kadar karanlıkta kalırsak kalalım. Her zaman bir ışık vardır.\nOnu görmemiz yeterlidir.`;

    const container = document.getElementById("container");
    let i = 0;

    function yazdir() {
      if (i < yazilar.length) {
        container.textContent += yazilar.charAt(i);
        i++;
        setTimeout(yazdir, 40);
      } else {
        // Final yazıyı büyük göster
        setTimeout(() => {
          const final = document.createElement("div");
          final.id = "final";
          final.textContent = finalText;
          container.appendChild(final);
          setTimeout(() => final.style.opacity = 1, 100);

          // Işık efekti
          const light = document.createElement("div");
          light.className = "light";
          document.body.appendChild(light);

          // Tam beyaz ekran efekti
          const white = document.createElement("div");
          white.className = "whiteout";
          document.body.appendChild(white);
        }, 500);
      }
    }

    yazdir();
  </script>
</body>
</html>
